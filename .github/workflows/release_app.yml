name: Release

# Every push to main publishes a new release: the version is bumped from the
# latest tag, written to manifest.json, committed, tagged, and the integration
# zip is attached to the GitHub release.
#
# Bump size: patch by default. Put "#minor" or "#major" anywhere in a commit
# message since the last release to bump more, or run the workflow manually
# and pick the bump. Put "[skip release]" in the head commit to skip a push.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "images/**"
      - "LICENSE*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

# Pushing the version commit and tag, and creating the release, need write
# access. Repos whose default workflow permission is read-only fail without it.
permissions:
  contents: write

# Never run two releases at once; they would compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # dist/ is a published copy of the card served from the integration.
      # Fail loudly rather than shipping a release where the two have drifted.
      - name: Verify dist/ matches the integration frontend
        run: |
          diff -u custom_components/wine_cellar_manager/frontend/wine-cellar-card.js \
                  dist/wine-cellar-card.js \
            || { echo "::error::dist/wine-cellar-card.js is out of sync; re-copy it from custom_components/wine_cellar_manager/frontend/"; exit 1; }

      - name: Compute next version
        id: version
        env:
          MANUAL_BUMP: ${{ github.event.inputs.bump }}
        run: |
          last=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-0.0.0}

          if [ "$last" != "0.0.0" ] && [ -z "$(git rev-list "$last"..HEAD)" ]; then
            echo "No commits since $last; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$MANUAL_BUMP" ]; then
            bump=$MANUAL_BUMP
          else
            range=$([ "$last" = "0.0.0" ] && echo HEAD || echo "$last..HEAD")
            messages=$(git log "$range" --format=%B)
            if echo "$messages" | grep -qi '#major'; then bump=major
            elif echo "$messages" | grep -qi '#minor'; then bump=minor
            else bump=patch
            fi
          fi

          IFS=. read -r major minor patch <<< "$last"
          case $bump in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"

          echo "Releasing $next ($bump bump from $last)"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # The version commit is pushed with GITHUB_TOKEN, which does not trigger
      # another workflow run, so this cannot loop.
      - name: Update manifest version, commit and tag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import json, os
          path = "custom_components/wine_cellar_manager/manifest.json"
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = os.environ["VERSION"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/wine_cellar_manager/manifest.json
          git commit -m "Release $VERSION [skip release]"
          git tag "$VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "$VERSION"

      - name: ZIP custom_components
        if: steps.version.outputs.skip != 'true'
        run: |
          cd custom_components
          zip wine_cellar_manager.zip -r wine_cellar_manager
          mv wine_cellar_manager.zip ../

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" wine_cellar_manager.zip \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
